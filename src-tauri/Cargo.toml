[package]
name = "app"
version = "2.1.0"
description = "EPAM AI/Run CodeMie Connect for macOS"
authors = ["EPAM Systems — People Organization / WPM"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process", "io-util", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
portable-pty = "0.8"
jsonc-parser = { version = "0.34.0", features = ["serde", "serde_json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
tauri-utils = { version = "2", features = ["resources"] }
