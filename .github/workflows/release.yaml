name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version or tag (e.g. 2.1.1 or v2.1.1; default: from tauri.conf.json)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  make-draft-release:
    name: Make Draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate and prepare release
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -eo pipefail

          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "::error::Manual release can only be triggered from the 'main' branch, not '${{ github.ref }}'." >&2
              exit 1
            fi

            git checkout main
            COMMIT_SHA=$(git rev-parse HEAD)

            INPUT_TAG="${RELEASE_TAG_INPUT}"
            INPUT_TAG="$(echo "${INPUT_TAG}" | xargs)"

            if [ -n "${INPUT_TAG}" ]; then
              VERSION="${INPUT_TAG#v}"
            else
              VERSION=$(jq -r .version src-tauri/tauri.conf.json)
            fi
            TAG="v${VERSION}"

            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Git tag '${TAG}' already exists in this repository! Refusing to overwrite." >&2
              exit 1
            fi
          else
            COMMIT_SHA="${GITHUB_SHA}"
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"

            if [[ "${TAG}" != v* ]]; then
              echo "::error::Git tag '${TAG}' must start with 'v' (e.g. v2.1.0)" >&2
              exit 1
            fi

            git merge-base --is-ancestor "${COMMIT_SHA}" origin/main || {
              echo "::error::Release tag '${TAG}' (commit ${COMMIT_SHA}) must point to a commit already merged into main." >&2
              exit 1
            }

            git checkout "${COMMIT_SHA}"

            CONF_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
            if [ "${VERSION}" != "${CONF_VERSION}" ]; then
              echo "::error::Tag '${TAG}' version does not match tauri.conf.json version '${CONF_VERSION}'" >&2
              exit 1
            fi
          fi

          if [[ ! "${VERSION}" =~ ${SEMVER_REGEX} ]]; then
            echo "::error::Invalid version '${VERSION}'. Expected stable X.Y.Z without leading zeros (e.g. 2.1.1)." >&2
            exit 1
          fi

          echo "Target commit SHA: ${COMMIT_SHA}"
          echo "Release tag: ${TAG}"
          echo "App version: ${VERSION}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::GitHub Release '${TAG}' already exists! Refusing to overwrite an existing release." >&2
            exit 1
          fi

          gh release create "${TAG}" \
            --target "${COMMIT_SHA}" \
            --draft \
            --title "${TAG}" \
            --notes ""

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build, Sign & Notarize (macOS)
    needs:
      - make-draft-release
    runs-on: macos-15
    timeout-minutes: 60
    environment: release

    steps:
      - name: Checkout repository at target commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.make-draft-release.outputs.commit_sha }}

      - name: Stamp version
        env:
          NEW_VERSION: ${{ needs.make-draft-release.outputs.version }}
        run: |
          jq --arg v "$NEW_VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          sed -i '' -E "s/^version = \".*\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      - name: Validate signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLEID }}
          APPLE_PASSWORD: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLETEAMID }}
        run: |
          missing=0
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::Required secret '${var}' is missing or empty in environment 'release'." >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Refusing to build an unsigned / unnotarized release." >&2
            exit 1
          fi
          echo "All required signing and notarization secrets are present."

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2.12.2 --no-audit --no-fund

      - name: Build and Sign DMG
        working-directory: src-tauri
        env:
          CI: true
          # Certificates for code signing:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: tauri build --bundles dmg

      - name: Normalize filenames
        working-directory: src-tauri/target/release/bundle/dmg
        run: |
          for f in *; do
            [ -f "$f" ] || continue
            # Replace spaces and underscores with hyphens
            new_name="$(echo "$f" | sed -E 's/[ _]/-/g')"
            if [ "$f" != "$new_name" ]; then
              echo "Renaming '$f' to '$new_name'"
              mv "$f" "$new_name"
            fi
          done

      - name: Notarize and Staple DMG
        id: notarize
        env:
          APPLE_ID: ${{ secrets.APPLEID }}
          APPLE_PASSWORD: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLETEAMID }}
        run: |
          set -eo pipefail
          DMG_PATH=$(ls -1 src-tauri/target/release/bundle/dmg/*.dmg | head -n1)
          echo "Notarizing ${DMG_PATH}..."
          AUTH="--apple-id ${APPLE_ID} --password ${APPLE_PASSWORD} --team-id ${APPLE_TEAM_ID}"
          xcrun notarytool submit "${DMG_PATH}" ${AUTH} --wait 2>&1 | tee notarytool.log
          UUID=$(awk '/id: / { print $2; exit; }' notarytool.log)
          if [[ -n "${UUID}" ]]; then
            echo "Fetching notarization log for ${UUID}..."
            xcrun notarytool log "${UUID}" ${AUTH} || true
          fi
          echo "Stapling ticket to DMG..."
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
        continue-on-error: true

      - name: Notarize and Staple DMG (retry)
        if: steps.notarize.outcome == 'failure'
        env:
          APPLE_ID: ${{ secrets.APPLEID }}
          APPLE_PASSWORD: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLETEAMID }}
        run: |
          set -eo pipefail
          sleep 30
          DMG_PATH=$(ls -1 src-tauri/target/release/bundle/dmg/*.dmg | head -n1)
          echo "Retrying notarization for ${DMG_PATH}..."
          AUTH="--apple-id ${APPLE_ID} --password ${APPLE_PASSWORD} --team-id ${APPLE_TEAM_ID}"
          xcrun notarytool submit "${DMG_PATH}" ${AUTH} --wait 2>&1 | tee notarytool.log
          UUID=$(awk '/id: / { print $2; exit; }' notarytool.log)
          if [[ -n "${UUID}" ]]; then
            echo "Fetching notarization log for ${UUID}..."
            xcrun notarytool log "${UUID}" ${AUTH} || true
          fi
          echo "Stapling ticket to DMG..."
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"

      - name: Generate Checksums
        working-directory: src-tauri/target/release/bundle/dmg
        run: |
          for f in *.dmg; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload artifacts to Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.make-draft-release.outputs.tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/dmg/*.sha256 \
            --clobber

  build-windows:
    name: Build & Sign NSIS
    needs:
      - make-draft-release
    runs-on: windows-2025
    timeout-minutes: 60
    environment: release

    steps:
      - name: Checkout repository at target commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.make-draft-release.outputs.commit_sha }}
          persist-credentials: false

      - name: Validate Azure signing configuration
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_NAME: ${{ vars.AZURE_CODE_SIGNING_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ vars.AZURE_CERT_PROFILE_NAME }}
        run: |
          $required = @(
            'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET',
            'AZURE_ENDPOINT', 'AZURE_CODE_SIGNING_NAME', 'AZURE_CERT_PROFILE_NAME'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "Missing signing settings in environment 'release': $($missing -join ', '). Refusing an unsigned release."
          }

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2.12.2 --no-audit --no-fund

      - name: Stamp version
        env:
          NEW_VERSION: ${{ needs.make-draft-release.outputs.version }}
        run: |
          $configPath = Join-Path $PWD 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $env:NEW_VERSION
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8NoBOM

          $cargoPath = Join-Path $PWD 'src-tauri/Cargo.toml'
          $cargo = Get-Content $cargoPath -Raw
          $pattern = [regex]::new('(?m)^version = "[^"]+"')
          $cargo = $pattern.Replace($cargo, ('version = "' + $env:NEW_VERSION + '"'), 1)
          [IO.File]::WriteAllText($cargoPath, $cargo, [Text.UTF8Encoding]::new($false))

      - name: Prepare Windows runtime key
        run: |
          $runtime = Get-Content runtime.json -Raw | ConvertFrom-Json
          $key = "$($runtime.cliVersion)-node$($runtime.nodeVersion)"
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'assets/windows/bin/runtime-key'),
            $key,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Windows app without bundling
        working-directory: src-tauri
        env:
          CI: true
        run: tauri build --no-bundle --no-sign

      - name: Sign Windows app
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE_NAME }}
          files: ${{ github.workspace }}\src-tauri\target\release\app.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Bundle signed Windows app into NSIS
        working-directory: src-tauri
        env:
          CI: true
        # Patching the executable after signing would invalidate its signature.
        run: tauri bundle --bundles nsis --no-sign --no-binary-patching

      - name: Sign NSIS installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release\bundle\nsis
          files-folder-filter: '*-setup.exe'
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify release signatures
        run: |
          $app = Get-Item 'src-tauri/target/release/app.exe'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)."
          }
          foreach ($file in (@($app) + $installers)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate) {
              throw "Invalid or non-timestamped signature: $($file.Name) ($($signature.Status))."
            }
            Write-Host "$($file.Name): signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Prepare Windows artifacts
        shell: bash
        run: bash scripts/prepare-artifacts.sh src-tauri/target/release/bundle/nsis windows

      - name: Upload artifacts to Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.make-draft-release.outputs.tag }}
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File |
            Where-Object {
              $_.Name -like '*-windows-amd64.exe' -or
              $_.Name -like '*-windows-amd64.exe.sha256'
            } |
            ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload Windows release artifacts."
          }

  publish-github-release:
    name: Publish GitHub Release
    needs:
      - make-draft-release
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.make-draft-release.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false
