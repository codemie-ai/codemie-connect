<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CodeMie Installation Wizard</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="main-row">
        <!-- Left: animated sprite + controls -->
        <aside id="sprite-panel">
          <canvas id="sprite-canvas" width="168" height="168"></canvas>
          <div id="sprite-label">Installer</div>
          <div id="status-pill"><span id="status-dot"></span><span id="status-text">Idle</span></div>
          <div id="sprite-controls">
            <button id="install-btn" class="btn btn-accent">Install</button>
            <button id="close-btn" class="btn btn-success hidden">Close</button>
            <label id="unattended-label">
              <input type="checkbox" id="unattended-cb" /> Unattended mode
            </label>
          </div>
        </aside>

        <div id="v-divider"></div>

        <!-- Right: scrollable step list -->
        <section id="step-panel">
          <div id="step-header">INSTALLATION STEPS</div>
          <div id="step-list"></div>
        </section>
      </div>

      <div id="h-divider"></div>

      <!-- Log toggle bar (always visible) -->
      <div id="log-bar">
        <button id="log-toggle">▸ Show log</button>
        <button id="open-log">Open Log</button>
      </div>

      <!-- Collapsible log -->
      <div id="log-panel" class="hidden"><div id="log-content"></div></div>

      <!-- Footer -->
      <footer id="footer">EPAM Systems © People Organization - WPM</footer>
    </div>

    <!-- Interactive terminal overlay (pty steps) -->
    <div id="terminal-overlay" class="overlay hidden">
      <div id="terminal-card">
        <div id="terminal-title">Interactive step</div>
        <div id="terminal-host"></div>
        <div id="terminal-hint">Follow the prompts above. This will close automatically when the step finishes.</div>
      </div>
    </div>

    <!-- Fatal error overlay -->
    <div id="fatal-overlay" class="overlay hidden">
      <div id="fatal-card">
        <div id="fatal-title">✗ Installation failed</div>
        <div id="fatal-message"></div>
        <div id="fatal-reco"></div>
        <button id="fatal-close" class="btn btn-accent">Close</button>
      </div>
    </div>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
